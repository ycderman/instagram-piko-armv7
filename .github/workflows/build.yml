name: Build Piko ARMv7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Instagram 439 ARMv7 input
        run: |
          set -euo pipefail
          test -s input/instagram-439-armv7.apk
          unzip -t input/instagram-439-armv7.apk >/dev/null

      - name: Fetch Piko v3.9.0-dev.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work apk
          gh release download v3.9.0-dev.6 \
            --repo crimera/piko \
            --pattern '*.mpp' \
            --dir work
          PIKO_MPP=$(find work -maxdepth 1 -type f -name '*.mpp' -print -quit)
          test -n "$PIKO_MPP"
          mv "$PIKO_MPP" work/piko.mpp

      - name: Fetch latest Morphe Desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download \
            --repo MorpheApp/morphe-desktop \
            --pattern '*-all.jar' \
            --dir work
          MORPHE_JAR=$(find work -maxdepth 1 -type f -name '*-all.jar' -print -quit)
          test -n "$MORPHE_JAR"
          mv "$MORPHE_JAR" work/morphe.jar

      - name: Patch minimal ARMv7 build
        env:
          MORPHE_DATA_DIR: ${{ github.workspace }}/work/morphe-data
        run: |
          set -euo pipefail
          java -Xms256m -Xmx3g -jar work/morphe.jar patch \
            -p work/piko.mpp \
            --exclusive \
            -e 'Disable ads' \
            -e 'Download media' \
            -e 'Clone' \
            --striplibs armeabi-v7a \
            --bytecode-mode STRIP_SAFE \
            -o apk/instagram-439-piko-armv7-minimal.apk \
            input/instagram-439-armv7.apk

      - name: Verify output
        run: |
          set -euo pipefail
          test -s apk/instagram-439-piko-armv7-minimal.apk
          unzip -t apk/instagram-439-piko-armv7-minimal.apk >/dev/null
          sha256sum apk/instagram-439-piko-armv7-minimal.apk | tee apk/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: instagram-439-piko-armv7-minimal
          path: apk/
          compression-level: 0
