name: Build Piko ARMv7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check input APKM
        run: |
          set -euo pipefail
          test -s input/instagram-armv7.apkm
          unzip -t input/instagram-armv7.apkm >/dev/null

      - name: Fetch Piko stable bundle
        run: |
          set -euo pipefail
          mkdir -p work apk
          curl -fsSL https://raw.githubusercontent.com/crimera/piko/main/patches-bundle.json -o work/patches-bundle.json
          PIKO_URL=$(jq -r '.download_url' work/patches-bundle.json)
          curl -fsSL "$PIKO_URL" -o work/piko.mpp

      - name: Fetch Morphe Desktop stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest -o work/morphe.json
          MORPHE_URL=$(jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' work/morphe.json | head -n1)
          curl -fsSL "$MORPHE_URL" -o work/morphe.jar

      - name: Patch minimal ARMv7 build
        env:
          MORPHE_DATA_DIR: ${{ github.workspace }}/work/morphe-data
        run: |
          set -euo pipefail
          java -Xms256m -Xmx3g -jar work/morphe.jar patch \
            -p work/piko.mpp \
            --exclusive \
            -e "Disable ads" \
            -e "Download media" \
            -e "Clone" \
            --striplibs armeabi-v7a \
            -o apk/instagram-piko-armv7-minimal.apk \
            input/instagram-armv7.apkm

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s apk/instagram-piko-armv7-minimal.apk
          unzip -t apk/instagram-piko-armv7-minimal.apk >/dev/null
          sha256sum apk/instagram-piko-armv7-minimal.apk | tee apk/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: instagram-piko-armv7-minimal
          path: apk/
          compression-level: 0

      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/instagram-piko-armv7-minimal.apk apk/SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "Build minimal Piko ARMv7 APK"
          git push
